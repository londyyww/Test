; LAST LIGHT - Dead Frequency relay station (outlying, ~2.8 km from the depot).
; Nobody needs to be here for it to matter: its generator burns down, the
; backup kicks in, the shift changes and an intrusion alarm seals it.
; Entirely abstract (no power-grid binding): it runs at Low tier until players approach.

[content]
version = 1

[location.RLY_STATION]
type = CommunicationsStation
profile.EquipmentCase = RLY_EQUIPMENT
profile.Locker = RLY_LOCKER
rarity_weights = Common:1, Uncommon:1, Rare:1, Exceptional:0.5

[table.RLY_COMMS_GEAR]
entry = elec.circuit_board    | weight=25 | qty=1-2 | rarity=Uncommon
entry = elec.relay_module     | weight=25 | qty=1-2 | rarity=Common
entry = mil.radio_battery     | weight=20 | qty=1-3 | rarity=Common | condition=DEPLETED_SUPPLIES
entry = tech.signal_processor | weight=10 | rarity=Rare
entry = tech.drone_core       | weight=3  | rarity=Exceptional

[table.RLY_PAPERS]
entry = intel.frequency_codebook | weight=10 | rarity=Rare
entry = intel.patrol_logs        | weight=30 | rarity=Common

[profile.RLY_EQUIPMENT]
pool = RLY_COMMS_GEAR | guaranteed | rolls=1-3

[profile.RLY_LOCKER]
pool = RLY_PAPERS | chance=0.8
pool = RLY_COMMS_GEAR | chance=0.5

[container.RLY_RACK_CASE]
location = RLY_STATION
type = EQUIPMENT_CASE
position = 200400, 200200, 0
access = seal:RLY_STORAGE        ; lockdown seals the equipment room

[container.RLY_OPERATOR_LOCKER]
location = RLY_STATION
type = LOCKER
position = 199600, 200300, 0

[area.RLY_SITE]
center = 200000, 200000, 0
radius_cm = 2000

[area.RLY_CP_EAST]
center = 206000, 200000, 0
radius_cm = 800

[area.RLY_CP_WEST]
center = 194000, 200000, 0
radius_cm = 800

[entity.RLY_GEN]
kind = Generator
area = RLY_SITE
fuel_seconds = 240             ; 4 minutes left in the tank
low_fuel_seconds = 60
persist = true

[entity.RLY_BACKUP]
kind = Generator
area = RLY_SITE
backup_for = RLY_GEN
fuel_seconds = 1800
start_delay_ticks = 90
persist = true

[entity.RLY_GRID]
kind = PowerNetwork
area = RLY_SITE
depends_on = RLY_GEN, RLY_BACKUP

[entity.RLY_SECURITY]
kind = SecuritySystem
area = RLY_SITE
depends_on = RLY_GRID

[entity.RLY_COMMS]
kind = CommsStation
area = RLY_SITE
depends_on = RLY_GRID

[entity.RLY_FACILITY]
kind = Facility
area = RLY_SITE
depends_on = RLY_GRID, RLY_SECURITY

[entity.RLY_STORAGE]
kind = Storage
area = RLY_SITE
depends_on = RLY_GRID, RLY_FACILITY

[entity.RLY_PATROL]
kind = PatrolGroup
area = RLY_CP_EAST
route = RLY_CP_EAST, RLY_SITE
dwell_ticks = 600
travel_ticks = 900
respond_radius_cm = 4000
comms = RLY_COMMS

; Shift change two minutes into the raid: central command moves the patrol west.
[schedule.RLY_SHIFT_CHANGE]
at_ticks = 3600
do = retask:RLY_PATROL=RLY_CP_WEST+RLY_SITE

; Six minutes in, the perimeter sensors trip.
[schedule.RLY_INTRUSION]
at_ticks = 10800
do = signal:AlarmRaised@RLY_SECURITY

[rule.RLY_LOCKDOWN]
on = state:RLY_SECURITY=Alarm
do = set:RLY_FACILITY=Lockdown, alert:RLY_FACILITY
once = true
