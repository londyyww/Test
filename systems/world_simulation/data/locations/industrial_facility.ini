; LAST LIGHT - Industrial facility (Dead Frequency map, 600 m east of the depot).
; A stamping plant kept alive by one generator with limited fuel. Tools and
; parts are everywhere, all of it worn by years of damp.

[content]
version = 1

[location.IND_PLANT]
type = Industrial
profile.Toolbox = IND_TOOLBOX
profile.Shelf = IND_SHELF
profile.Locker = IND_LOCKER
profile.StorageCabinet = IND_PARTS_CABINET
rarity_weights = Common:1, Uncommon:0.7, Rare:0.25, Exceptional:0.02
scavenged_chance = 0.1
integrity_shift = -0.05

[table.IND_TOOLS]
entry = tool.wrench_set    | weight=25 | rarity=Common
entry = tool.multitool     | weight=20 | rarity=Uncommon
entry = tool.soldering_kit | weight=10 | rarity=Uncommon
entry = tool.bolt_cutter   | weight=6  | rarity=Rare

[table.IND_MECH_PARTS]
entry = mech.bearing_set    | weight=30 | qty=1-4 | rarity=Common
entry = mech.spring_pack    | weight=30 | qty=2-6 | rarity=Common
entry = mech.gear_assembly  | weight=15 | qty=1-2 | rarity=Uncommon
entry = mech.hydraulic_seal | weight=15 | qty=1-3 | rarity=Uncommon | condition=HEAVILY_WORN

[table.IND_ELEC_PARTS]
entry = elec.copper_wire    | weight=30 | qty=2-8 | rarity=Common
entry = elec.capacitor_bank | weight=15 | rarity=Uncommon
entry = elec.circuit_board  | weight=10 | rarity=Uncommon

[table.IND_BREAKROOM]
entry = cons.tea          | weight=20 | qty=1-3 | rarity=Common
entry = cons.cigarettes   | weight=20 | qty=1-6 | rarity=Common
entry = cons.water_bottle | weight=15 | rarity=Common | condition=DEPLETED_SUPPLIES
entry = cons.fuel_can     | weight=5  | rarity=Uncommon | condition=DEPLETED_SUPPLIES

[profile.IND_TOOLBOX]
pool = IND_MECH_PARTS | guaranteed | rolls=1-2
pool = IND_TOOLS      | chance=0.45
pool = IND_ELEC_PARTS | chance=0.35

[profile.IND_SHELF]
empty_chance = 0.25
pool = IND_MECH_PARTS | chance=0.8 | rolls=1-2
pool = IND_ELEC_PARTS | chance=0.4

[profile.IND_LOCKER]
pool = IND_BREAKROOM | chance=0.9 | rolls=1-2
pool = IND_TOOLS     | chance=0.15

[profile.IND_PARTS_CABINET]
pool = IND_ELEC_PARTS | guaranteed | rolls=1-2
pool = IND_MECH_PARTS | chance=0.6

; Crushed corner of the workshop: a damaged toolbox with degraded parts.
[container.IND_DAMAGED_TOOLBOX]
location = IND_PLANT
type = TOOLBOX
position = 61200, 600, 0
condition = Damaged

[container.IND_SHELF_A]
location = IND_PLANT
type = SHELF
position = 60400, -900, 0

[container.IND_WORKER_LOCKER]
location = IND_PLANT
type = LOCKER
position = 59200, 1100, 0

[container.IND_PARTS_CABINET]
location = IND_PLANT
type = CABINET
position = 62000, -1200, 0

[area.IND_HALL]
center = 60000, 0, 0
radius_cm = 2500

[area.IND_YARD]
center = 63500, 3500, 0
radius_cm = 1500

[area.IND_LOADING]
center = 57000, -3500, 0
radius_cm = 1200

; Bound to industrial_power.ini: the power grid owns fuel and distribution.
[entity.IND_GEN]
kind = Generator
area = IND_HALL
bind = node:GEN_IND
persist = true

[entity.IND_GRID]
kind = PowerNetwork
area = IND_HALL
bind = node:LIGHT_IND
depends_on = IND_GEN

[entity.IND_PRESS]
kind = Machinery
area = IND_HALL
bind = node:PRESS_IND
depends_on = IND_GRID

[entity.IND_FACILITY]
kind = Facility
area = IND_HALL
depends_on = IND_GRID

[entity.IND_PATROL]
kind = PatrolGroup
area = IND_YARD
route = IND_YARD, IND_HALL
dwell_ticks = 450
travel_ticks = 300
respond_radius_cm = 4500

; Blackout: the plant is dark, so the patrol stops sweeping the hall and
; guards the loading dock and yard instead.
[rule.IND_BLACKOUT_REASSIGN]
on = state:IND_GRID=Offline
do = retask:IND_PATROL=IND_LOADING+IND_YARD

[rule.IND_POWER_BACK]
on = state:IND_GRID=Nominal
do = retask:IND_PATROL=IND_YARD+IND_HALL
