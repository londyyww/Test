; LAST LIGHT - Residential building (Dead Frequency map, 600 m west).
; A five-storey block of flats. Everyday supplies, nothing military. Loot is
; instanced per player here: each survivor searches their own flats.

[content]
version = 1

[location.RES_BLOCK]
type = Residential
profile.Shelf = RES_KITCHEN_SHELF
profile.StorageCabinet = RES_CUPBOARD
profile.Locker = RES_BASEMENT_LOCKER
rarity_weights = Common:1, Uncommon:0.5, Rare:0.1, Exceptional:0
scavenged_chance = 0.35        ; first place anyone would look
integrity_shift = -0.1         ; damp, unheated for years
ownership = PerPlayer

[table.RES_FOOD]
