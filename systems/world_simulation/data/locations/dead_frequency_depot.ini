; LAST LIGHT - Dead Frequency military depot.
; A signals depot abandoned mid-evacuation: ammunition and comms gear left in
; locked racks, a checkpoint at each approach road, a patrol that never stopped.
; Map coordinates (cm): depot yard at the origin.

[content]
version = 1

; ------------------------------------------------------------------ LOOT
[location.DF_DEPOT]
type = MilitaryDepot
profile.MilitaryCrate = DF_MIL_CRATE
profile.Locker = DF_LOCKER
profile.EquipmentCase = DF_EQUIPMENT_CASE
profile.StorageCabinet = DF_CABINET
rarity_weights = Common:1, Uncommon:1, Rare:0.8, Exceptional:0.3
chance_scale = 1.0
scavenged_chance = 0.05        ; locked military storage: rarely stripped
ownership = Shared

[location.DF_CHECKPOINT]
type = MilitaryCheckpoint
profile.Locker = DF_CHECKPOINT_LOCKER
profile.HiddenStash = DF_GUARD_STASH
profile.VehicleCompartment = DF_VEHICLE
rarity_weights = Common:1, Uncommon:0.8, Rare:0.4, Exceptional:0.05
scavenged_chance = 0.3         ; on the road: passers-by got here first
integrity_shift = -0.1         ; exposed to the weather

[table.DF_AMMO]
entry = ammo.545x39.ps | weight=40 | qty=30-60 | rarity=Common
entry = ammo.762x39.ps | weight=25 | qty=20-60 | rarity=Common
entry = ammo.9x18.pm   | weight=20 | qty=16-50 | rarity=Uncommon

[table.DF_MIL_GEAR]
entry = mil.gas_mask_filter     | weight=30 | qty=1-3 | rarity=Common
entry = mil.ration_irp          | weight=30 | qty=1-2 | rarity=Common
entry = mil.radio_battery       | weight=20 | qty=1-2 | rarity=Uncommon
entry = armor.pouch_set         | weight=12 | rarity=Uncommon
entry = armor.plate_insert_steel| weight=6  | rarity=Rare

; One prize per crate at most: suppressor, optic or encrypted drive.
[table.DF_ATTACHMENTS]
entry = att.foregrip       | weight=30 | rarity=Uncommon
entry = att.suppressor_pbs | weight=10 | rarity=Rare | exclusive=PRIZE
entry = att.optic_pso      | weight=10 | rarity=Rare | exclusive=PRIZE

[table.DF_TECH]
entry = tech.signal_processor | weight=20 | rarity=Rare | condition=DAMAGED_ELECTRONICS
entry = tech.encrypted_drive  | weight=5  | rarity=Exceptional | exclusive=PRIZE

[table.DF_INTEL]
entry = intel.patrol_logs        | weight=30 | rarity=Common
entry = intel.frequency_codebook | weight=8  | rarity=Rare | group=CODEBOOK

[table.DF_CHECKPOINT_SUPPLIES]
entry = ammo.545x39.ps    | weight=20 | qty=5-20 | rarity=Common
entry = cons.cigarettes   | weight=25 | qty=2-8  | rarity=Common
entry = cons.tea          | weight=20 | qty=1-3  | rarity=Common
entry = mil.ration_irp    | weight=15 | rarity=Common | condition=DEPLETED_SUPPLIES
entry = med.bandage_sterile | weight=10 | qty=1-2 | rarity=Common

[table.DF_VEHICLE_PARTS]
entry = mech.bearing_set   | weight=20 | qty=1-2 | rarity=Common | condition=HEAVILY_WORN
entry = mech.hydraulic_seal| weight=15 | qty=1-2 | rarity=Common
entry = elec.relay_module  | weight=10 | rarity=Uncommon
entry = cons.fuel_can      | weight=8  | rarity=Uncommon | condition=DEPLETED_SUPPLIES

[profile.DF_MIL_CRATE]
pool = DF_AMMO        | guaranteed | rolls=1-2 | group=AMMO
pool = DF_MIL_GEAR    | chance=0.7  | rolls=1-2
pool = DF_ATTACHMENTS | chance=0.35 | rolls=1 | requires=AMMO
pool = DF_TECH        | chance=0.15 | rolls=1

[profile.DF_LOCKER]
pool = DF_MIL_GEAR | guaranteed | rolls=1
pool = DF_INTEL    | chance=0.5 | rolls=1
pool = DF_AMMO     | chance=0.3 | rolls=1

[profile.DF_EQUIPMENT_CASE]
pool = DF_TECH  | guaranteed | rolls=1 | group=TECH
pool = DF_INTEL | chance=0.4 | rolls=1 | requires=TECH

[profile.DF_CABINET]
empty_chance = 0.2
pool = DF_MIL_GEAR | chance=0.8 | rolls=1-2
pool = DF_INTEL    | chance=0.3

[profile.DF_CHECKPOINT_LOCKER]
empty_chance = 0.15
pool = DF_CHECKPOINT_SUPPLIES | chance=1.0 | rolls=1-3

[profile.DF_GUARD_STASH]
pool = DF_CHECKPOINT_SUPPLIES | guaranteed | rolls=2
pool = DF_ATTACHMENTS         | chance=0.4

[profile.DF_VEHICLE]
pool = DF_VEHICLE_PARTS | chance=0.9 | rolls=1-2

; Armory crate: electronic rack lock powered from the depot generator.
[container.DF_ARMORY_CRATE]
location = DF_DEPOT
type = MIL_CRATE
position = 1500, 500, 0
access = power:ARMORY_LOCK

; Duty-officer locker: needs the red depot keycard.
[container.DF_OFFICER_LOCKER]
location = DF_DEPOT
type = LOCKER
position = 1700, 900, 0
access = clearance:keycard.depot_red

; Signals equipment case with a damaged lock: bolt cutters, loud.
[container.DF_SIGNALS_CASE]
location = DF_DEPOT
type = EQUIPMENT_CASE
position = 1200, 900, 0
condition = Damaged
access = tool:tool.bolt_cutter

; Supply cabinet half buried by the collapsed roof.
[container.DF_COLLAPSED_CABINET]
location = DF_DEPOT
type = CABINET
position = 600, -800, 0
condition = PartiallyDestroyed
access = work:90

; Sealed when the depot goes into lockdown.
[container.DF_STORE_CRATE]
location = DF_DEPOT
type = MIL_CRATE
position = 1800, -300, 0
access = seal:DF_STORAGE

[container.DF_CP_NORTH_LOCKER]
location = DF_CHECKPOINT
type = LOCKER
position = 0, 6200, 0

[container.DF_CP_NORTH_STASH]
location = DF_CHECKPOINT
type = HIDDEN_STASH
position = 300, 6300, 0
access = discovery

[container.DF_CP_SOUTH_TRUCK]
location = DF_CHECKPOINT
type = VEHICLE_COMPARTMENT
position = 200, -6200, 0

; ------------------------------------------------------------------ WORLD SIMULATION
[area.DF_YARD]
center = 0, 0, 0
radius_cm = 2000

[area.DF_ARMORY]
center = 1500, 500, 0
radius_cm = 800
objective = true

[area.DF_CHECKPOINT_N]
center = 0, 6000, 0
radius_cm = 800

[area.DF_CHECKPOINT_S]
center = 0, -6000, 0
radius_cm = 800

; Power-grid nodes are owned by the facility (depot_power.ini); these entities
; only mirror them at mission level.
[entity.DF_GEN]
kind = Generator
area = DF_YARD
bind = node:GEN_DEPOT
persist = true

[entity.DF_GRID]
kind = PowerNetwork
area = DF_YARD
bind = node:ARMORY_LOCK
depends_on = DF_GEN

[entity.DF_SECURITY]
kind = SecuritySystem
area = DF_YARD
bind = node:ALARM_DEPOT
depends_on = DF_GRID

[entity.DF_COMMS]
kind = CommsStation
area = DF_YARD
bind = node:RADIO_DEPOT
depends_on = DF_GRID

[entity.DF_DEPOT]
kind = Facility
area = DF_YARD
depends_on = DF_GRID, DF_SECURITY

[entity.DF_STORAGE]
kind = Storage
area = DF_ARMORY
depends_on = DF_DEPOT

; The patrol that never stopped: north checkpoint -> yard -> south checkpoint.
[entity.DF_PATROL]
kind = PatrolGroup
area = DF_CHECKPOINT_N
route = DF_CHECKPOINT_N, DF_YARD, DF_CHECKPOINT_S
dwell_ticks = 300
travel_ticks = 450
respond_radius_cm = 5000
respond_hold_ticks = 600
comms = DF_COMMS

[rule.DF_ALARM_LOCKDOWN]
on = state:DF_SECURITY=Alarm
do = set:DF_DEPOT=Lockdown, alert:DF_DEPOT
once = true
