; LAST LIGHT - shared world content (loot vocabulary + simulation tiers).
; Same INI convention as the power grid and world-intelligence data.
; Units: ticks @ 30 Hz, centimetres. Item ids are owned by the item catalog.

[content]
version = 1

; ------------------------------------------------------------------ SIMULATION
[simulation]
ticks_per_second = 30
max_updates_per_step = 256
max_timers_per_step = 512
queue_capacity = 16384
relevance_interval_ticks = 15     ; area tiers re-evaluated twice a second
observed_window_ticks = 300       ; a seen entity stays High for 10 s
max_transitions_per_step = 256
event_log_capacity = 1024
max_pending_instructions = 4

[tier.High]
interval_ticks = 3                ; 10 Hz near active encounters
radius_cm = 3000

[tier.Medium]
interval_ticks = 30               ; 1 Hz nearby facilities, active patrols
radius_cm = 9000

[tier.Low]
interval_ticks = 600              ; every 20 s for the distant world

; ------------------------------------------------------------------ LOOT
[loot]
capacity_factor = Intact:1, Damaged:1, PartiallyDestroyed:0.5, Destroyed:0
integrity_factor = Intact:1, Damaged:0.85, PartiallyDestroyed:0.6, Destroyed:0

; Item categories. Items name their category in the catalog; data here only
; says how condition is rolled for that category.
[category.AMMUNITION]
default_condition = SEALED
uses_fill = false

[category.MEDICAL]
default_condition = STERILE
uses_fill = true

[category.MECHANICAL]
default_condition = WORN_MECHANICAL

[category.ELECTRICAL]
default_condition = DAMAGED_ELECTRONICS

[category.TOOLS]
default_condition = WORN_MECHANICAL

[category.MILITARY_EQUIPMENT]
default_condition = INTACT_MILITARY

[category.WEAPON_ATTACHMENT]
default_condition = INTACT_MILITARY

[category.ARMOR_ATTACHMENT]
default_condition = INTACT_MILITARY

[category.RECOVERED_TECH]
default_condition = DEGRADED_TECH

[category.INTELLIGENCE]
default_condition = PAPER

[category.CONSUMABLE]
default_condition = PRESERVED
uses_fill = true

; Condition ranges (integrity 0..1, fill 0..1).
[condition.SEALED]
integrity = 0.9-1.0

[condition.STERILE]
integrity = 0.8-1.0
fill = 0.85-1.0

[condition.DEPLETED_SUPPLIES]
integrity = 0.55-0.9
fill = 0.15-0.6

[condition.WORN_MECHANICAL]
integrity = 0.35-0.75

[condition.HEAVILY_WORN]
integrity = 0.1-0.4

[condition.DAMAGED_ELECTRONICS]
integrity = 0.15-0.55

[condition.INTACT_MILITARY]
integrity = 0.7-0.95

[condition.DEGRADED_TECH]
integrity = 0.05-0.3

[condition.PAPER]
integrity = 0.4-0.9

[condition.PRESERVED]
integrity = 0.6-1.0
fill = 0.5-1.0

; Container types (capacity in slot units).
[container_type.MIL_CRATE]
category = MilitaryCrate
capacity = 12
search_ticks = 90
search_noise_db = 64             ; steel lid and latches: a metallic clank
force_ticks = 120
force_noise_db = 82
interact_range_cm = 200

[container_type.LOCKER]
category = Locker
capacity = 8
search_ticks = 60
search_noise_db = 48
force_ticks = 90
force_noise_db = 80

[container_type.CABINET]
category = StorageCabinet
capacity = 10
search_ticks = 75
search_noise_db = 46

[container_type.MED_CABINET]
category = MedicalContainer
capacity = 8
search_ticks = 60
search_noise_db = 42

[container_type.TOOLBOX]
category = Toolbox
capacity = 6
search_ticks = 45
search_noise_db = 55

[container_type.SHELF]
category = Shelf
capacity = 6
search_ticks = 30
search_noise_db = 38

[container_type.VEHICLE_COMPARTMENT]
category = VehicleCompartment
capacity = 6
search_ticks = 60
search_noise_db = 50

[container_type.HIDDEN_STASH]
category = HiddenStash
capacity = 6
search_ticks = 60
search_noise_db = 35

[container_type.EQUIPMENT_CASE]
category = EquipmentCase
capacity = 8
search_ticks = 60
search_noise_db = 45
force_ticks = 90
force_noise_db = 78
