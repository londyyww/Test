; LAST LIGHT - Dead Frequency depot power grid (llenv facility format).
; Loaded by llenv::LoadFacilityFile; the world simulation only mirrors it.

[facility]
id = dead_frequency_depot
ticks_per_second = 30
seed = 4401

[node.GEN_DEPOT]
type = Generator
network = Depot
position = -300, 200, 0
capacity_kw = 30
starts_running = false         ; dark depot: players must restore power
startup_ticks = 60
noise_db = 72
noise_pulse_ticks = 300
persistence = World

[node.BRK_DEPOT]
type = Breaker
network = Depot
fed_by = GEN_DEPOT
position = 0, 200, 0
capacity_kw = 25

[node.ARMORY_LOCK]
type = Machinery               ; electronic rack lock: holds while unpowered
network = Depot
fed_by = BRK_DEPOT
position = 1500, 500, 0
demand_kw = 0.5
priority = 90
starts_on = true

[node.LIGHT_ARMORY]
type = Light
network = Depot
fed_by = BRK_DEPOT
position = 1500, 500, 400
demand_kw = 1
priority = 40
light_radius_cm = 1200

[node.RADIO_DEPOT]
type = CommArray
network = Depot
fed_by = BRK_DEPOT
position = 200, -400, 600
demand_kw = 2
priority = 60
starts_on = true

[node.ALARM_DEPOT]
type = Alarm
network = Depot
fed_by = BRK_DEPOT
position = 800, 0, 300
demand_kw = 0.5
priority = 95
noise_db = 98
alarm_duration_ticks = 600
