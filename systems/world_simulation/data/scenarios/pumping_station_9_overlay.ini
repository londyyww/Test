; LAST LIGHT - world-simulation overlay for Pumping Station 9 (PR #3 example map).
; Used by the integration tests to prove hazard and weather events from the
; existing world-intelligence systems reach mission-level world state.
; Power nodes and hazards are defined in world_intelligence/data.

[content]
version = 1

[area.PS9_PLANT]
center = 1500, 0, 0
radius_cm = 3500

[area.PS9_STORE]
center = -1000, -1000, 0
radius_cm = 1000

[entity.PS9_GEN]
kind = Generator
area = PS9_PLANT
bind = node:GEN_A

[entity.PS9_GRID]
kind = PowerNetwork
area = PS9_PLANT
bind = node:LIGHT_HALL_1
depends_on = PS9_GEN

[entity.PS9_RELAY]
kind = CommsStation
area = PS9_PLANT
bind = node:COMMS_RELAY
depends_on = PS9_GRID

[entity.PS9_STORE_FIRE]
kind = HazardZone
area = PS9_STORE
bind = hazard:FIRE_STORE

[entity.PS9_FACILITY]
kind = Facility
area = PS9_PLANT
depends_on = PS9_GRID, PS9_STORE_FIRE

; A storm takes the relay mast down for mission purposes.
[rule.PS9_STORM_COMMS]
on = signal:WeatherSevere
do = signal:CommsLost@PS9_RELAY

[rule.PS9_STORM_OVER]
on = signal:WeatherCleared
do = signal:CommsRestored@PS9_RELAY
