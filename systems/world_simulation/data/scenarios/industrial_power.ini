; LAST LIGHT - industrial facility power grid (llenv facility format).
; One generator with a minute of fuel left feeds the plant; an emergency light
; takes over when it dies.

[facility]
id = dead_frequency_industrial
ticks_per_second = 30
seed = 4402

[node.GEN_IND]
type = Generator
network = Plant
position = 59000, -500, 0
capacity_kw = 20
starts_running = true
fuel_ticks = 1800              ; 60 s of fuel left
fuel_item = cons.fuel_can
noise_db = 76
noise_pulse_ticks = 300
persistence = World

[node.BUS_IND]
type = Junction
network = Plant
fed_by = GEN_IND
position = 59500, 0, 0

[node.PRESS_IND]
type = Machinery
network = Plant
fed_by = BUS_IND
position = 61000, -800, 0
demand_kw = 6
priority = 20
noise_db = 82
starts_on = true

[node.LIGHT_IND]
type = Light
network = Plant
fed_by = BUS_IND
position = 60000, 0, 600
demand_kw = 2
priority = 40
light_radius_cm = 2500

[node.EMERG_IND]
type = EmergencyLight
network = Plant
fed_by = BUS_IND
position = 60500, 500, 500
demand_kw = 0.2
priority = 99
emergency_battery_ticks = 5400
light_radius_cm = 1800
