; LAST LIGHT - Acoustic Intelligence System: designer overrides.
; Loaded on top of AisConfig::MakeDefault(). Unknown sections/keys are errors.
; Band lists are "low, mid, high". Loudness is gameplay dB at 1 m.

[world]
ticks_per_second = 30
max_perception_checks_per_tick = 1024

[category.Gunfire]
loudness_db = 100
threat = 1.0
hostile = true

[surface.Metal]
loudness_offset_db = 8
spectrum_shift_db = -2, 0, 6

[material.Sandbags]
loss_db = 18, 28, 38
loss_db_per_meter = 20, 30, 40

; Third archetype added purely through data: a heavy, low-band listener that
; is very hard to pull off its post.
[robot.WARDEN]
base = SENTINEL
band_sensitivity_db = 14, 6, 0
localization_skill = 0.7
max_investigation_range_cm = 2500
objective_commitment = 2.0
interest.Explosion = 2.0
interest.Footstep = 0.6
sensory_update_interval_ticks = 4

[decoy.FlareGunPop]
pattern = TimedBurst
apparent_category = Gunfire
loudness_db = 92
artificiality = 0.45
arm_delay_ticks = 60
lifetime_ticks = 90
max_emissions = 1
