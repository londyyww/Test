; LAST LIGHT - example infrastructure: "Relay Outpost" (generic military site).
; Pure data: nothing in C++ references these ids. Units: cm, kW, ticks @30 Hz.
;
; Intended play: the base is dark. Restoring main power brings lights, the
; security terminal and the extraction lift back - but also re-arms the gate
; sensor, wakes the alarm, starts a noisy compressor and pulls robots in.

[facility]
id = relay_outpost
ticks_per_second = 30
seed = 7341

; ---------------------------------------------------------------- MAIN GRID
[node.GEN_MAIN]
type = Generator
network = Main
position = 0, 0, 0
capacity_kw = 60
fuel_ticks = 1800        ; one minute of diesel left in the tank
fuel_item = DieselCan
refuel_amount_ticks = 9000
startup_ticks = 120
noise_db = 74
noise_pulse_ticks = 150
persistence = World      ; damage/fuel survive between missions

[node.GEN_BACKUP]
type = BackupGenerator
network = Main
position = 600, -400, 0
capacity_kw = 25
health = 0.4             ; damaged: half output, may backfire on start
auto_start = true
auto_start_delay_ticks = 90
startup_ticks = 60
noise_db = 70
repair_item = SpareParts
repair_ticks = 240
persistence = WorldOnExtraction

[node.BUS_MAIN]
type = Junction
network = Main
fed_by = GEN_MAIN, GEN_BACKUP
position = 300, 0, 0

[node.BRK_SECURITY]
type = Breaker
network = Main
fed_by = BUS_MAIN
position = 350, 100, 0
capacity_kw = 20

[node.BRK_LIGHTS]
type = Breaker
network = Main
fed_by = BUS_MAIN
position = 350, 0, 0
capacity_kw = 12          ; all four yard lights + emergency = 12.4 kW -> trips

[node.BRK_INDUSTRIAL]
type = Breaker
network = Main
fed_by = BUS_MAIN
position = 350, -100, 0
capacity_kw = 30
fuse_installed = false
fuse_item = Fuse
persistence = World

; ---- security circuit (priority high: shed last)
[node.DOOR_ARMORY]
type = Door
network = Main
fed_by = BRK_SECURITY
position = 1500, 800, 0
demand_kw = 1
priority = 80
starts_locked = true
fail_mode = FailSecure
key_item = ArmoryKeycard
force_item = Crowbar
alarm = ALARM_MAIN
persistence = World

[node.DOOR_MAINT]
type = Door
network = Main
fed_by = BRK_SECURITY
position = 2200, -900, 0
demand_kw = 1
priority = 70
starts_locked = true
fail_mode = FailSafe     ; maintenance tunnel: lock drops when power dies
manual_work = 240

[node.GATE_EXTRACT]
type = SecurityGate
network = Main
fed_by = BRK_SECURITY
position = 4000, 0, 0
demand_kw = 4
priority = 85
starts_locked = true
fail_mode = FailSecure
manual_participants = 2
manual_work = 600
motor_ticks = 120
interact_range_cm = 400

[node.TERM_SEC]
type = Terminal
network = Main
fed_by = BRK_SECURITY
position = 1200, 300, 0
demand_kw = 1
priority = 90
hack_ticks = 240
controls = GATE_EXTRACT, ALARM_MAIN, SENSOR_GATE, BRK_INDUSTRIAL

[node.ALARM_MAIN]
type = Alarm
network = Main
fed_by = BRK_SECURITY
position = 2000, 0, 300
demand_kw = 2
priority = 95
noise_db = 98
alarm_interval_ticks = 45
alarm_duration_ticks = 1800
trigger_on_power_restore = true   ; security reboot when power returns

[node.SENSOR_GATE]
type = SecuritySensor
network = Main
fed_by = BRK_SECURITY
position = 3700, 0, 0
demand_kw = 0.5
priority = 95
alarm = ALARM_MAIN
sensor_radius_cm = 900
starts_on = true

[node.EXTRACT_LIFT]
type = ExtractionPoint
network = Main
fed_by = BRK_SECURITY
position = 4400, 0, 0
demand_kw = 5
priority = 60
call_ticks = 450
manual_participants = 2
objective_signal = extraction_called
noise_db = 100

