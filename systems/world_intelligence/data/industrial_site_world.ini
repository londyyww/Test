; LAST LIGHT - world intelligence config for Pumping Station 9.
; Weather, hazards, squads and routes. References power-grid node ids from
; industrial_site.ini; nothing here is hardcoded in C++.

[world]
exposed_nodes = GEN_A          ; storms wear down damaged exposed equipment
report_min_confidence = 0.3

[route.west_yard]
id = 1
waypoints = -500, 1500, 0 | 1500, 2500, 0 | 4000, 2000, 0

[route.east_hall]
id = 2
waypoints = 1500, 300, 0 | 2500, 0, 0 | 4000, 0, 0

; ------------------------------------------------------------------ WEATHER
[weather]
initial = Clear
auto_advance = false           ; scenarios drive weather explicitly
transition_ticks = 300
update_interval_ticks = 30
bounds_min = -8000, -8000, 0
bounds_max = 8000, 8000, 0
seed = 4242

[gust.roof_sheet]
position = 2400, 200, 800
metallic = true

[gust.yard_fence]
position = -1500, 2500, 0

; ------------------------------------------------------------------ HAZARDS
[hazards]
update_interval_ticks = 15
exposure_interval_ticks = 15

[hazard.CABLE_ARC]
type = Electrical
position = 2100, 100, 0
radius_cm = 250
power_node = CABLE_EAST        ; live only while the cable run is energized
starts_active = true
damage_per_second = 18
noise_db = 60
noise_interval_ticks = 90
exposed = true                 ; puddles extend the danger

[hazard.GAS_STORE]
type = GasLeak
position = 2400, -200, 0
radius_cm = 500
growth_per_second = 0.02
ignition_threshold = 0.5
ignites = FIRE_STORE
damage_per_second = 4
burst_damage = 45
activation_noise_db = 58
player_triggerable = true      ; a player can crack the valve open
exposed = false

[hazard.FIRE_STORE]
type = Fire
position = 2500, -300, 0
radius_cm = 400
severity = 0.9
flammable = true
duration_ticks = 2700
spread_radius_cm = 1600
spread_interval_ticks = 120
spread_chance = 0.45
smoke = SMOKE_STORE
route_id = 2
damages_nodes = GEN_B
node_damage_per_second = 0.01
damage_per_second = 25
thermal_clutter = 0.7
activation_noise_db = 86
noise_db = 68
noise_interval_ticks = 120
extinguish_item = Extinguisher
exposed = false

[hazard.FIRE_OFFICE]
type = Fire
position = 3600, 400, 0
radius_cm = 350
severity = 0.7
flammable = true
duration_ticks = 1800
smoke = SMOKE_OFFICE
damage_per_second = 20
thermal_clutter = 0.6
activation_noise_db = 80
exposed = false

[hazard.SMOKE_STORE]
type = Smoke
position = 2600, -100, 0
radius_cm = 1400
severity = 0.9
visibility_reduction = 0.9
damage_per_second = 1.5

[hazard.SMOKE_OFFICE]
type = Smoke
position = 3600, 400, 0
radius_cm = 1100
severity = 0.8
visibility_reduction = 0.85
damage_per_second = 1

[hazard.ROOF_TRUSS]
type = Structural
position = 2600, -200, 600
radius_cm = 700
stress_warn = 0.5
stress_collapse = 1.0
stress_per_fire_second = 0.012
stress_per_loud_event = 0.3
stress_per_wind_second = 0.002
route_id = 2
damages_nodes = CABLE_EAST     ; the falling truss tears the cable run
burst_node_damage = 1.0
burst_damage = 60
activation_noise_db = 108
noise_db = 66
persistence = Facility

[hazard.CRUSHER_ZONE]
type = Machinery
position = 3200, -500, 0
radius_cm = 220
power_node = CRUSHER
damage_per_second = 60
noise_db = 0

[hazard.ACID_SPILL]
type = Chemical
position = 900, -900, 0
radius_cm = 200
max_radius_cm = 650
growth_per_second = 6
starts_active = true
damage_per_second = 6
movement_penalty = 0.3

; ------------------------------------------------------------------ SQUADS
[squads]
coordination_interval_ticks = 15
report_latency_ticks = 6
stale_order_ticks = 300

; Third robot type defined only in data: heavy, short radio, holds ground.
[role.WARDEN]
can_investigate = false
can_observe = false
can_flank = false
can_defend = true
comms_range_cm = 2500
observation_standoff_cm = 800

[squad.ALPHA]
members = 1:SENTINEL, 2:SENTINEL, 3:WRAITH, 4:WARDEN
relay_node = COMMS_RELAY
relay_position = 1000, 800, 900
relay_range_cm = 9000
defend_point = 400, 400, 0
patrol.1 = 500, 1500, 0 | 2500, 1500, 0
patrol.2 = 3500, -1500, 0 | 1500, -1500, 0
patrol.3 = -1500, 0, 0 | -1500, 2000, 0
patrol.4 = 6500, 0, 0
